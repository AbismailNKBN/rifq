<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>رِفْق — المدرسة القرآنية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>رِفْق</h1>
      <small>متابعة حفظ واستظهار القرآن الكريم</small>
    </div>
    <button class="theme-toggle" id="themeBtn" title="تبديل المظهر">☀️</button>
  </header>

  <div id="app">
    <div style="text-align:center; padding:30px; color:var(--muted);">جاري تشغيل المنظومة...</div>
  </div>
</div>

<div id="toast"></div>

<!-- نافذة التعديل المنبثقة -->
<div id="editModal" class="modal-overlay" style="display:none;">
  <div class="modal-sheet">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="color:var(--accent);">تعديل بيانات التلميذ</h3>
      <button class="btn ghost" style="width:auto; padding:3px 10px;" onclick="closeEditModal()">✕</button>
    </div>
    
    <input type="hidden" id="editStudentId">
    
    <label class="section-lbl">اسم التلميذ:</label>
    <input type="text" id="editStudentName" placeholder="اسم التلميذ الكامل">

    <label class="section-lbl">هاتف الولي (للواتساب):</label>
    <input type="text" id="editStudentPhone" placeholder="مثال: 0555123456">

    <div style="font-size:12px; color:var(--muted); margin-bottom:14px;">
      الرمز الدائم للولي: <b id="editStudentCode" style="color:var(--gold);"></b>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:12px;">
      <button class="btn" onclick="saveStudentEdit()">💾 حفظ التعديل</button>
      <button class="btn ghost" onclick="closeEditModal()">إلغاء</button>
    </div>

    <hr style="border:0; border-top:1px solid var(--card-line); margin:14px 0;">

    <button type="button" class="btn danger" onclick="deleteStudentAction()">🗑️ حذف هذا التلميذ نهائياً</button>
  </div>
</div>

<script src="config.js"></script>
<script>
const C = window.RIFQ_CONFIG;
const app = document.getElementById('app');
let currentPin = '';

let toastTimer;
function toast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3000);
}

function normalizePhone(p) {
  let clean = String(p || '').replace(/[^0-9]/g, '');
  if (clean.startsWith('0') && clean.length === 10) {
    clean = '213' + clean.slice(1);
  }
  return clean;
}

async function rpc(fn, args) {
  const res = await fetch(C.SUPABASE_URL.replace(/\/$/, '') + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': C.SUPABASE_KEY,
      'Authorization': 'Bearer ' + C.SUPABASE_KEY
    },
    body: JSON.stringify(args || {})
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(_) { data = text; }
  if (!res.ok) throw new Error((data && data.message) || 'تعذر الاتصال بقاعدة البيانات');
  return data;
}

const themeBtn = document.getElementById('themeBtn');
if (themeBtn) {
  themeBtn.onclick = () => {
    const cur = document.documentElement.dataset.theme;
    const next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    themeBtn.textContent = next === 'light' ? '🌙' : '☀️';
  };
}

function renderHome() {
  app.innerHTML = `
    <div class="card" style="text-align:center;">
      <h3 style="margin-bottom:8px;">مرحباً بك</h3>
      <p style="color:var(--muted); font-size:0.85rem; margin-bottom:16px;">اختر صفة الدخول للمتابعة</p>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button class="btn" onclick="renderTeacherGate()">👨‍🏫 الأستاذ</button>
        <button class="btn ghost" onclick="renderParentGate()">👪 ولي التلميذ</button>
      </div>
    </div>
  `;
}

// ---------------- واجهة الأستاذ ----------------
window.renderTeacherGate = () => {
  const pin = sessionStorage.getItem('rifq_pin');
  if(pin) { currentPin = pin; return loadTeacherBoard(pin); }

  app.innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:10px;">دخول الأستاذ</h3>
      <label class="section-lbl">الرمز السري</label>
      <input type="password" id="pinInput" placeholder="الرمز السري (الافتراضي 1234)">
      <button class="btn" id="loginBtn">دخول</button>
      <button class="btn ghost" style="margin-top:8px;" onclick="renderHome()">رجوع</button>
    </div>
  `;
  document.getElementById('loginBtn').onclick = () => {
    const p = document.getElementById('pinInput').value.trim();
    if(!p) return toast('أدخل الرمز أولاً', true);
    currentPin = p;
    loadTeacherBoard(p);
  };
};

async function loadTeacherBoard(pin) {
  app.innerHTML = `<div style="text-align:center; padding:30px; color:var(--muted);">جاري جلب القائمة...</div>`;
  try {
    const students = await rpc('teacher_get_students', { p_pin: pin });
    sessionStorage.setItem('rifq_pin', pin);
    renderTeacherApp(pin, students);
  } catch(err) {
    toast(err.message, true);
    sessionStorage.removeItem('rifq_pin');
    renderTeacherGate();
  }
}

function renderTeacherApp(pin, students) {
  const today = new Date().toISOString().slice(0, 10);
  let html = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <span style="font-weight:800; color:var(--accent);">القسم (${students.length} تلميذ)</span>
      <div style="display:flex; gap:6px;">
        <button class="btn ghost" style="width:auto; padding:4px 10px; font-size:12px;" onclick="exportExcel('${pin}')">تصدير Excel 📊</button>
        <button class="btn ghost" style="width:auto; padding:4px 10px; font-size:12px;" onclick="sessionStorage.removeItem('rifq_pin'); renderHome();">خروج</button>
      </div>
    </div>

    <div class="card" style="border-color:var(--field-line);">
      <span class="section-lbl">➕ تلميذ جديد</span>
      <input type="text" id="newName" placeholder="اسم التلميذ الكامل" style="margin-bottom:6px;">
      <input type="text" id="newPhone" placeholder="هاتف الولي للواتساب (اختياري)" style="margin-bottom:8px;">
      <button class="btn" style="padding:8px;" onclick="addStudent('${pin}')">تسجيل التلميذ</button>
    </div>

    <div class="card" style="padding:10px 14px;">
      <span class="section-lbl">تاريخ حصة اليوم</span>
      <input type="date" id="sessDate" value="${today}" style="margin:4px 0 0;">
    </div>
  `;

  students.forEach(s => {
    html += `
      <div class="student-card" data-id="${s.id}" data-name="${s.name}" data-phone="${s.phone}">
        <div class="student-head">
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="student-name">${s.name}</span>
            <button type="button" class="btn-edit" onclick="openEditModal('${s.id}', '${s.name}', '${s.phone || ''}', '${s.code}')">تعديل ⚙️</button>
          </div>
          <span class="score-badge">${s.total_score} نقطة</span>
        </div>

        <div class="section-lbl">الاستظهار:</div>
        <div class="pill-grid rec-pills">
          <button type="button" class="pill" data-val="استظهر بحفظ ممتاز" data-score="3" onclick="selectPill(this, 'sel-rec-3')">ممتاز (+3)</button>
          <button type="button" class="pill" data-val="استظهر" data-score="1" onclick="selectPill(this, 'sel-rec-1')">استظهر (+1)</button>
          <button type="button" class="pill" data-val="لم يستظهر" data-score="0" onclick="selectPill(this, 'sel-rec-0')">لم يستظهر (0)</button>
          <button type="button" class="pill" data-val="غائب" data-score="" onclick="selectPill(this, 'sel-rec-absent')">غائب</button>
        </div>

        <div class="section-lbl">السلوك:</div>
        <div class="pill-grid beh-pills">
          <button type="button" class="pill" data-val="جيد" onclick="selectPill(this, 'sel-beh-good')">جيد</button>
          <button type="button" class="pill" data-val="حسن" onclick="selectPill(this, 'sel-beh-ok')">حسن</button>
          <button type="button" class="pill" data-val="متوسط" onclick="selectPill(this, 'sel-beh-mid')">متوسط</button>
        </div>

        <input type="text" class="st-note" placeholder="ملاحظة خاصة (اختياري)" style="margin-bottom:6px; font-size:13px; padding:8px 10px;">
        
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:11px; color:var(--muted);">الرمز: <b>${s.code}</b></span>
          <button type="button" class="btn whatsapp" onclick="sendWhatsapp('${s.name}', '${s.phone}', this)">واتساب 💬</button>
        </div>
      </div>
    `;
  });

  html += `
    <div style="position:sticky; bottom:12px; margin-top:14px;">
      <button class="btn" onclick="saveSession('${pin}')">💾 اعتماد وحفظ نتائج اليوم</button>
    </div>
  `;

  app.innerHTML = html;
}

window.selectPill = (btn, activeCls) => {
  Array.from(btn.parentElement.children).forEach(c => c.className = 'pill');
  btn.className = 'pill ' + activeCls;
};

window.openEditModal = (id, name, phone, code) => {
  document.getElementById('editStudentId').value = id;
  document.getElementById('editStudentName').value = name;
  document.getElementById('editStudentPhone').value = phone;
  document.getElementById('editStudentCode').textContent = code;
  document.getElementById('editModal').style.display = 'flex';
};

window.closeEditModal = () => {
  document.getElementById('editModal').style.display = 'none';
};

window.saveStudentEdit = async () => {
  const id = document.getElementById('editStudentId').value;
  const name = document.getElementById('editStudentName').value.trim();
  const phone = document.getElementById('editStudentPhone').value.trim();
  if(!name) return toast('اسم التلميذ لا يمكن أن يكون فارغاً', true);

  try {
    await rpc('teacher_update_student', { p_pin: currentPin, p_id: id, p_name: name, p_phone: phone });
    toast('تم تعديل البيانات بنجاح ✓');
    closeEditModal();
    loadTeacherBoard(currentPin);
  } catch(e) { toast(e.message, true); }
};

window.deleteStudentAction = async () => {
  const id = document.getElementById('editStudentId').value;
  const name = document.getElementById('editStudentName').value;
  
  if(!confirm(`هل أنت متأكد من حذف التلميذ «${name}»؟\nسيتم حذف جميع سجلاته القرآنية نهائياً.`)) return;

  try {
    await rpc('teacher_delete_student', { p_pin: currentPin, p_id: id });
    toast('تم حذف التلميذ');
    closeEditModal();
    loadTeacherBoard(currentPin);
  } catch(e) { toast(e.message, true); }
};

window.addStudent = async (pin) => {
  const name = document.getElementById('newName').value.trim();
  const phone = document.getElementById('newPhone').value.trim();
  if(!name) return toast('اكتب اسم التلميذ', true);

  try {
    const res = await rpc('teacher_add_student', { p_pin: pin, p_name: name, p_phone: phone });
    toast(`تمت إضافة ${res.name} بنجاح ✓`);
    loadTeacherBoard(pin);
  } catch(e) { toast(e.message, true); }
};

window.sendWhatsapp = (name, phone, btn) => {
  const card = btn.closest('.student-card');
  const rec = card.querySelector('.rec-pills .pill[class*="sel-"]');
  const beh = card.querySelector('.beh-pills .pill[class*="sel-"]');
  const note = card.querySelector('.st-note').value.trim();

  const text = `السلام عليكم ورحمة الله،\nتقرير حصة القرآن الكريم للتلميذ (${name}):\n\n`
             + `📖 الاستظهار: ${rec ? rec.dataset.val : 'تم التقييم'}\n`
             + `⭐ السلوك: ${beh ? beh.dataset.val : 'حسن'}\n`
             + (note ? `📝 ملاحظة المعلّم: ${note}\n` : '')
             + `\nوفقنا الله وإياكم لتربية أبنائنا على القرآن الكريم.`;

  const clean = normalizePhone(phone);
  window.open('https://wa.me/' + clean + '?text=' + encodeURIComponent(text), '_blank');
};

window.saveSession = async (pin) => {
  const date = document.getElementById('sessDate').value;
  const cards = document.querySelectorAll('.student-card');
  const records = [];

  cards.forEach(c => {
    const rec = c.querySelector('.rec-pills .pill[class*="sel-"]');
    const beh = c.querySelector('.beh-pills .pill[class*="sel-"]');
    const note = c.querySelector('.st-note').value.trim();

    if(rec || beh) {
      records.push({
        student_id: c.dataset.id,
        status: rec ? rec.dataset.val : 'لم يُحدد',
        score: rec ? rec.dataset.score : null,
        behavior: beh ? beh.dataset.val : 'حسن',
        note: note
      });
    }
  });

  if(records.length === 0) return toast('قيّم تلميذاً واحداً على الأقل', true);

  try {
    const count = await rpc('teacher_save_session', { p_pin: pin, p_date: date, p_records: records });
    toast(`تم حفظ نتائج ${count} تلميذ بنجاح ✓`);
    loadTeacherBoard(pin);
  } catch(e) { toast(e.message, true); }
};

window.exportExcel = async (pin) => {
  try {
    toast('جاري تجهيز ملف Excel...');
    const data = await rpc('teacher_export_all', { p_pin: pin });
    if (!data || data.length === 0) return toast('لا توجد بيانات مسجلة للتصدير', true);

    const headers = ['اسم التلميذ', 'الرمز', 'تاريخ الحصة', 'حالة الاستظهار', 'النقاط', 'السلوك العام', 'الملاحظات'];
    const rows = [headers];

    data.forEach(d => {
      rows.push([
        `"${d.student_name}"`,
        `"${d.student_code}"`,
        `"${d.session_date}"`,
        `"${d.status}"`,
        `"${d.score !== null ? d.score : ''}"`,
        `"${d.behavior}"`,
        `"${(d.note || '').replace(/"/g, '""')}"`
      ]);
    });

    const csvContent = '\uFEFF' + rows.map(e => e.join(',')).join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `سجل_مدرسة_رفق_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
    URL.revokeObjectURL(url);
    toast('تم تحميل ملف Excel بنجاح ✓');
  } catch(e) { toast(e.message, true); }
};

// ---------------- واجهة الولي ----------------
window.renderParentGate = (prefillCode) => {
  const code = prefillCode || localStorage.getItem('rifq_code') || '';
  app.innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:6px;">متابعة التلميذ</h3>
      <p style="color:var(--muted); font-size:0.8rem; margin-bottom:12px;">أدخل رمز المتابعة المسلّم من الأستاذ</p>
      <input type="text" id="parentCode" value="${code}" placeholder="مثال: A1B2C3" style="text-transform:uppercase;">
      <button class="btn" id="showHistoryBtn">عرض السجل</button>
      <button class="btn ghost" style="margin-top:8px;" onclick="renderHome()">رجوع</button>
    </div>
  `;
  const load = async () => {
    const c = document.getElementById('parentCode').value.trim().toUpperCase();
    if(!c) return toast('أدخل الرمز أولاً', true);
    app.innerHTML = `<div style="text-align:center; padding:30px; color:var(--muted);">جاري جلب السجل القرآني...</div>`;
    try {
      const data = await rpc('parent_get_history', { p_code: c });
      localStorage.setItem('rifq_code', c);
      renderParentView(data);
    } catch(e) {
      toast(e.message, true);
      renderParentGate(c);
    }
  };
  document.getElementById('showHistoryBtn').onclick = load;
  if(prefillCode) load();
};

function renderParentView(data) {
  let html = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <button class="btn ghost" style="width:auto; padding:4px 10px; font-size:12px;" onclick="renderParentGate()">تغيير الرمز</button>
      <span style="font-size:12px; color:var(--muted);">ملف التلميذ</span>
    </div>

    <div class="card" style="background:linear-gradient(135deg, rgba(25,227,166,0.15), rgba(9,138,101,0.2));">
      <div style="font-size:12px; color:var(--muted);">التلميذ الحافظ</div>
      <h2 style="font-size:1.4rem; color:var(--accent); margin:4px 0;">${data.name}</h2>
      <div style="font-size:12px; margin-top:6px;">
        مجموع النقاط: <b style="color:var(--gold); font-size:1rem;">${data.total_score}</b> نقطة
      </div>
    </div>

    <h4 style="margin:14px 4px 8px; color:var(--ink2);">سجل الحصص السابقة (${data.history.length})</h4>
  `;

  if(data.history.length === 0) {
    html += `<div class="card" style="text-align:center; color:var(--muted);">لا توجد حصص مسجلة بعد.</div>`;
  } else {
    data.history.forEach(h => {
      html += `
        <div class="history-item">
          <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
            <span style="color:var(--muted); font-size:11px;">📅 ${h.date}</span>
            <strong style="color:var(--accent);">${h.status}</strong>
          </div>
          <div style="font-size:12px;">
            السلوك: <b>${h.behavior}</b>
            ${h.note ? ` | ملاحظة: <i>${h.note}</i>` : ''}
          </div>
        </div>
      `;
    });
  }

  app.innerHTML = html;
}

const urlParamCode = new URLSearchParams(window.location.search).get('code');
if(urlParamCode) renderParentGate(urlParamCode);
else renderHome();
</script>
</body>
</html>
